# XcodeGen spec — `xcodegen generate` produces OddDough.xcodeproj.
# CI runs this on macOS before building.
name: OddDough
options:
  bundleIdPrefix: com.cashcompass
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  OddDough:
    type: application
    platform: iOS
    sources:
      - path: OddDough
        excludes:
          - "Info.plist"
    resources:
      - path: www
    info:
      path: OddDough/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        BGTaskSchedulerPermittedIdentifiers: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cashcompass.app
      PRODUCT_NAME: OddDough
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      ENABLE_BITCODE: false
    scheme: {}
